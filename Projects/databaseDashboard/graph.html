<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sensor Node Graph</title>
    <style>
        * { box-sizing: border-box; }
        html, body { width: 100%; min-height: 100%; }
        body {
            margin: 0;
            padding: 12px;
            color: #171717;
            font-family: Arial, Helvetica, sans-serif;
            background: #fff;
        }
        .chart-wrap {
            position: relative;
            width: 100%;
            height: 390px;
        }
        #chartMessage {
            margin: 0 0 8px;
            color: #563900;
            text-align: center;
        }
        @media (max-width: 560px) {
            body { padding: 8px; }
            .chart-wrap { height: 340px; }
        }
    </style>
    <script src="/chartjs/chart.umd.min.js" defer></script>
    <script src="/app.js?v=3" defer></script>
</head>
<body>
    <p id="chartMessage" role="status" aria-live="polite">Loading sensor readings…</p>
    <div class="chart-wrap">
        <canvas id="mycanvas" aria-label="Sensor temperature by time" role="img"></canvas>
    </div>
</body>
</html>
